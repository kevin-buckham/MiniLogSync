name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build identity
        id: info
        run: |
          echo "label=$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "code=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_OUTPUT"

      # No gradle wrapper committed (cannot generate the wrapper jar offline);
      # the setup-gradle action provides the gradle CLI.
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PbuildLabel=${{ steps.info.outputs.label }} \
            -PbuildCode=${{ steps.info.outputs.code }}

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/MiniLogSync-${{ steps.info.outputs.label }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MiniLogSync-${{ steps.info.outputs.label }}
          path: out/*.apk
          if-no-files-found: error
